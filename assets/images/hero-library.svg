<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173B67"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <circle cx="400" cy="180" r="220" fill="url(#glow)"/>
  
  <!-- Architectural Shelves Illustration -->
  <g opacity="0.4" stroke="#94A3B8" stroke-width="1.5">
    <line x1="120" y1="80" x2="680" y2="80"/>
    <line x1="120" y1="180" x2="680" y2="180"/>
    <line x1="120" y1="280" x2="680" y2="280"/>
    <line x1="120" y1="380" x2="680" y2="380"/>
    <line x1="260" y1="60" x2="260" y2="400"/>
    <line x1="400" y1="60" x2="400" y2="400"/>
    <line x1="540" y1="60" x2="540" y2="400"/>
  </g>

  <!-- Stylized Books on shelves -->
  <g>
    <!-- Shelf 1 -->
    <rect x="140" y="110" width="16" height="70" rx="2" fill="#3B82F6"/>
    <rect x="160" y="100" width="20" height="80" rx="2" fill="#E8F1FA" opacity="0.8"/>
    <rect x="184" y="125" width="14" height="55" rx="2" fill="#60A5FA"/>
    <rect x="202" y="105" width="22" height="75" rx="2" fill="#93C5FD"/>
    <rect x="280" y="95" width="24" height="85" rx="2" fill="#14B8A6"/>
    <rect x="308" y="115" width="18" height="65" rx="2" fill="#0D9488"/>
    <rect x="330" y="105" width="16" height="75" rx="2" fill="#5EEAD4"/>
    <rect x="420" y="110" width="20" height="70" rx="2" fill="#818CF8"/>
    <rect x="444" y="90" width="24" height="90" rx="2" fill="#6366F1"/>
    <rect x="560" y="120" width="18" height="60" rx="2" fill="#F59E0B"/>
    <rect x="582" y="100" width="22" height="80" rx="2" fill="#FBBF24"/>

    <!-- Shelf 2 -->
    <rect x="140" y="210" width="22" height="70" rx="2" fill="#EC4899"/>
    <rect x="166" y="200" width="18" height="80" rx="2" fill="#F43F5E"/>
    <rect x="280" y="215" width="20" height="65" rx="2" fill="#3B82F6"/>
    <rect x="304" y="195" width="26" height="85" rx="2" fill="#2563EB"/>
    <rect x="420" y="205" width="18" height="75" rx="2" fill="#10B981"/>
    <rect x="442" y="215" width="22" height="65" rx="2" fill="#059669"/>
    <rect x="560" y="200" width="25" height="80" rx="2" fill="#64748B"/>
    <rect x="589" y="220" width="16" height="60" rx="2" fill="#94A3B8"/>
  </g>

  <!-- Open Academic Book Centerpiece -->
  <g transform="translate(400, 370)">
    <path d="M-110 -40 C-60 -50, -10 -45, 0 -30 C10 -45, 60 -50, 110 -40 L95 10 C50 0, 10 5, 0 15 C-10 5, -50 0, -95 10 Z" fill="#FFFFFF"/>
    <path d="M-110 -40 C-60 -50, -10 -45, 0 -30 L0 15 C-10 5, -50 0, -95 10 Z" fill="#F8FAFC"/>
    <line x1="0" y1="-30" x2="0" y2="15" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M-90 -30 C-60 -36, -25 -32, -15 -22" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M-90 -18 C-60 -24, -25 -20, -15 -10" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M-90 -6 C-60 -12, -25 -8, -15 2" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M15 -22 C25 -32, 60 -36, 90 -30" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M15 -10 C25 -20, 60 -24, 90 -18" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M15 2 C25 -8, 60 -12, 90 -6" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Modern Academic Title / Badge -->
  <rect x="250" y="440" width="300" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.1"/>
  <text x="400" y="460" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#E8F1FA" text-anchor="middle" letter-spacing="1.5">PUSAT SUMBER BELAJAR &amp; RISET INFORMATIKA</text>
</svg>
